name: Flutter

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'oracle'
          java-version: '17'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'

      - name: Set Up Android SDK
        # v3 installs the removed `tools` package and fails on current
        # runners (sdkmanager: "Failed to find package 'tools'"); v4 installs
        # platform-tools instead.
        uses: android-actions/setup-android@v4.0.4

      - name: Install Dependencies
        run: flutter pub get

      - name: Code Style
        # Generated files are excluded: slang writes translations with its own
        # formatting, so `dart format` would rewrite them on every run and
        # `dart run slang` would undo it. Handwritten sources must be formatted.
        run: |
          find lib test -name '*.dart' ! -name '*.g.dart' -print0 \
            | xargs -0 dart format --output=none --set-exit-if-changed

      - name: Lint
        run: flutter analyze .

      - name: Unit tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --debug
