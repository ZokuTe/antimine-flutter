name: Windows build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath antimine-windows-x64.zip
          Get-FileHash antimine-windows-x64.zip -Algorithm SHA256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antimine-windows-x64
          path: antimine-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
